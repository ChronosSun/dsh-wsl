name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pkg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pure unit tests (no WSL required)
        run: |
          node test/preset-default.test.mjs
          node test/changes-paths.test.mjs
