      description: 极简模式，在 WSL 工作区内执行。
      order: 104
      plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are a helpful software engineer assistant.
          complete: true
          includeRuntimeContext: false
      - id: wsl-world
        name: cordis:group
        group: true
        isolate:
          subprocess: true
          shell: true
          fs: true
        config:
        - *id001
        - *id002
